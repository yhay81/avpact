[package]
name = "avpact"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Declarative, inspectable, and verifiable media transformations"
repository = "https://github.com/yhay81/avpact"
rust-version = "1.85"
readme = "README.md"
keywords = ["ffmpeg", "media", "video", "audio", "cli"]
categories = ["command-line-utilities", "multimedia"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/INSTALL.md",
    "/CONCEPT.md",
    "/ROADMAP.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/RELEASING.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/GOVERNANCE.md",
    "/SUPPORT.md",
    "/ADOPTERS.md",
    "/FUZZING.md",
    "/LICENSE",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3.4"
fs2 = "0.4"
libc = "0.2"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
