name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package manifest
        run: cargo package --locked --allow-dirty
      - name: JSON fixtures
        run: |
          python3 -m json.tool tests/fixtures/METADATA.json >/dev/null
          python3 -m json.tool tests/fixtures/ffprobe/sample.json >/dev/null

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Record capability matrix
        shell: bash
        run: cargo run --quiet --locked -- capabilities --format json > capabilities-${{ runner.os }}.json
      - name: Require subtitle capability on Linux
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          with open("capabilities-Linux.json", encoding="utf-8") as handle:
              report = json.load(handle)
          operation = next(item for item in report["operations"] if item["operation"] == "burn_subtitles")
          if not operation["supported"]:
              raise SystemExit(f"Linux FFmpeg lacks required subtitle capability: {operation['missing']}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capabilities-${{ runner.os }}
          path: capabilities-${{ runner.os }}.json
