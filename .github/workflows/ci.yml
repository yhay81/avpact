name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package manifest
        run: cargo package --locked --allow-dirty
      - name: Benchmark harness smoke
        shell: bash
        run: bash -n benchmarks/run.sh
      - name: JSON fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fixtures = sorted(Path("tests/fixtures").rglob("*.json"))
          if not fixtures:
              raise SystemExit("no JSON fixtures found")
          for fixture in fixtures:
              with fixture.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"validated {len(fixtures)} JSON fixtures")
          PY

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-audit
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 \
            --locked --no-default-features
      - name: Audit Rust dependencies
        run: cargo +1.88.0 audit --deny warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Record capability matrix
        shell: bash
        run: cargo run --quiet --locked -- capabilities --format json > capabilities-${{ runner.os }}.json
      - name: Require subtitle capability on Linux
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          with open("capabilities-Linux.json", encoding="utf-8") as handle:
              report = json.load(handle)
          operation = next(item for item in report["operations"] if item["operation"] == "burn_subtitles")
          if not operation["supported"]:
              raise SystemExit(f"Linux FFmpeg lacks required subtitle capability: {operation['missing']}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capabilities-${{ runner.os }}
          path: capabilities-${{ runner.os }}.json
